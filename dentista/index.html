<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F5F1EA" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <!--app-head-->
    <script>
      // Animações só escondem conteúdo depois que o JavaScript carrega.
      // Se o script principal falhar, a classe sai sozinha e nada fica invisível.
      document.documentElement.classList.add('js-ready');
      setTimeout(function () {
        if (!window.__animReady) document.documentElement.classList.remove('js-ready');
      }, 2500);
    </script>
  </head>
  <body data-page="home">
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
